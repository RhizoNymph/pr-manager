name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Check tag matches Cargo version
        id: version
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "Cargo.toml version ($version) does not match tag ($tag)" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Test
        run: cargo test --locked

      - name: Check package
        run: cargo publish --locked --dry-run

  publish-cargo:
    name: Publish to crates.io
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Publish crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          name="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].name')"
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if curl -A "pr-manager-release-workflow" -fsS "https://crates.io/api/v1/crates/${name}/${version}" >/dev/null; then
            echo "${name} ${version} is already published on crates.io"
            exit 0
          fi
          cargo publish --locked

  build-artifacts:
    name: Build release artifacts
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deb
        run: cargo install cargo-deb --locked

      - name: Build binary
        run: cargo build --release --locked

      - name: Package binary tarball
        run: |
          mkdir -p dist
          cp target/release/pr-manager dist/pr-manager
          tar -C dist -czf "pr-manager-${{ needs.validate.outputs.version }}-x86_64-unknown-linux-gnu.tar.gz" pr-manager

      - name: Build .deb
        run: cargo deb --no-build

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            pr-manager-*.tar.gz
            target/debian/*.deb

  publish-apt:
    name: Publish to APT repository
    needs: build-artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: ./artifacts

      - name: Check out apt-repo branch
        uses: actions/checkout@v4
        with:
          ref: apt-repo
          path: apt-repo

      - name: Import GPG key
        run: |
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          cat > ~/.gnupg/gpg.conf <<'EOF'
          batch
          yes
          pinentry-mode loopback
          EOF
          echo "allow-loopback-pinentry" > ~/.gnupg/gpg-agent.conf
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | base64 -d | gpg --batch --import
          key_fpr="$(gpg --batch --with-colons --list-secret-keys | awk -F: '/^fpr:/ {print $10; exit}')"
          if [ -z "$key_fpr" ]; then
            echo "No secret signing key was imported" >&2
            exit 1
          fi
          echo "KEY_FPR=$key_fpr" >> "$GITHUB_ENV"

      - name: Install reprepro
        run: sudo apt-get update && sudo apt-get install -y reprepro

      - name: Add .deb to repository
        run: |
          cd apt-repo
          sed -i '/^SignWith:/d' conf/distributions
          sed -i '/^ask-passphrase$/d' conf/options
          find ../artifacts -name '*.deb' -print0 | while IFS= read -r -d '' deb; do
            reprepro remove stable pr-manager || true
            reprepro includedeb stable "$deb"
          done

      - name: Sign APT repository
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          cd apt-repo
          gpg_args=(--batch --yes --pinentry-mode loopback --local-user "$KEY_FPR")
          if [ -n "${GPG_PASSPHRASE:-}" ]; then
            gpg_args+=(--passphrase "$GPG_PASSPHRASE")
          fi
          rm -f dists/stable/InRelease dists/stable/Release.gpg
          gpg "${gpg_args[@]}" --clearsign -o dists/stable/InRelease dists/stable/Release
          gpg "${gpg_args[@]}" --armor --detach-sign -o dists/stable/Release.gpg dists/stable/Release

      - name: Push updated repository
        run: |
          cd apt-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "APT repository already up to date"
            exit 0
          fi
          git commit -m "Update repository: ${{ github.ref_name }}"
          git push

  github-release:
    name: Create GitHub Release
    needs:
      - validate
      - build-artifacts
      - publish-cargo
      - publish-apt
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: ./artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./artifacts/**/*.deb
            ./artifacts/*.tar.gz
          generate_release_notes: true
