[package]
name = "pr-manager"
version = "0.2.0"
edition = "2021"
description = "Standalone GitHub poller that invokes a coding agent to merge main into pending auto-merge PRs."
publish = false

[[bin]]
name = "pr-manager"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.99"
thiserror = "2.0.16"
tokio = { version = "1.47.1", features = ["rt-multi-thread", "macros", "fs", "time", "process", "signal", "sync"] }
reqwest = { version = "0.12.23", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.225", features = ["derive"] }
serde_json = "1.0.145"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["json", "env-filter"] }
dotenvy = "0.15.7"
dirs = "6.0.0"
shell-escape = "0.1.5"
url = "2.5.7"
toml = "0.8.19"
